<!-- 设置 Tab 内容 -->
<div id="settings-tab" class="tab-content hidden">
    <div class="grid grid-cols-1 gap-6">
        
        <!-- 数据源管理 -->
        <div class="card neon-border">
            <div class="card-body">
                <h2 class="card-title text-lg mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
                    </svg>
                    数据源管理
                </h2>
                
                <!-- 数据源列表 -->
                <div class="overflow-x-auto">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="datasource-list">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-4">
                    <button class="btn btn-primary btn-sm" onclick="SettingsManager.showAddModal()">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        添加数据源
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 缓存 -->
        <div class="card neon-border">
            <div class="card-body py-3" style="min-height: auto;">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <!-- 左侧标题 -->
                    <h2 class="card-title text-base m-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        缓存
                    </h2>
                    
                    <!-- 右侧控件组 -->
                    <div class="flex flex-wrap items-center gap-3">
                        <!-- 缓存状态 -->
                        <span id="cache-status" class="text-sm text-white">加载中...</span>

                        <!-- 缓存失效时间 -->
                        <div class="flex items-center gap-2">
                            <input type="number" id="cache-expire-days" class="input input-bordered input-sm w-16" min="1" max="365" value="7">
                            <span class="text-sm text-white">天</span>
                            <button class="btn btn-outline btn-sm" onclick="SettingsManager.saveExpireDays()">保存</button>
                        </div>
                        
                        <!-- 分隔线 -->
                        <div class="w-px h-5 bg-gray-600"></div>
                        
                        <!-- 手动刷新 -->
                        <button class="btn btn-accent btn-sm" onclick="SettingsManager.refreshCache()">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI 模型配置 -->
        <div class="card neon-border">
            <div class="card-body">
                <h2 class="card-title text-lg mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                    AI 模型配置（用于「AI 选基」）
                </h2>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="form-control">
                        <label class="label"><span class="label-text">模型提供商</span></label>
                        <select id="llm-provider" class="select select-bordered select-sm" onchange="SettingsManager.onLlmProviderChanged()">
                            <option value="">请选择</option>
                        </select>
                    </div>

                    <div class="form-control">
                        <label class="label"><span class="label-text">API Key</span></label>
                        <input type="password" id="llm-api-key" class="input input-bordered input-sm" placeholder="sk-...">
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">模型名称</span>
                            <span id="llm-model-hint" class="label-text-alt text-slate-400"></span>
                        </label>
                        <div class="flex gap-2">
                            <div id="llm-model-combobox" class="combobox flex-1" data-combobox>
                                <div class="combobox-control">
                                    <input type="text" id="llm-model" class="combobox-input" autocomplete="off"
                                           placeholder="填 API Key 后点右侧按钮获取" aria-autocomplete="list"
                                           aria-controls="llm-model-menu" aria-expanded="false" role="combobox">
                                    <button type="button" class="combobox-clear" tabindex="-1" title="清除" aria-label="清除">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                    </button>
                                    <button type="button" class="combobox-caret" tabindex="-1" aria-label="展开">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                                        </svg>
                                    </button>
                                </div>
                                <ul id="llm-model-menu" class="combobox-menu" role="listbox"></ul>
                            </div>
                            <button type="button" class="btn btn-outline btn-sm" onclick="SettingsManager.fetchLlmModels()">获取</button>
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Base URL（可选）</span>
                            <span id="llm-base-url-hint" class="label-text-alt text-slate-400"></span>
                        </label>
                        <input type="text" id="llm-base-url" class="input input-bordered input-sm" placeholder="自定义 API 端点">
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">分析持仓期数</span>
                            <span class="label-text-alt text-slate-400">默认 8（约 2 年）</span>
                        </label>
                        <input type="number" id="ai-holding-periods" class="input input-bordered input-sm" min="1" max="40" placeholder="8">
                    </div>
                </div>

                <div class="mt-4 flex items-center gap-2 flex-wrap">
                    <button type="button" class="btn btn-outline btn-sm" onclick="SettingsManager.testLlmConfig()">测试连接</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="SettingsManager.saveLlmConfig()">保存配置</button>
                    <span id="llm-config-status" class="text-sm text-slate-300"></span>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 添加/编辑数据源模态框 -->
<dialog id="datasource-modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4" id="datasource-modal-title">添加数据源</h3>
        <form id="datasource-form" onsubmit="SettingsManager.handleSubmit(event)">
            <input type="hidden" id="datasource-id">
            
            <div class="form-control mb-3">
                <label class="label">
                    <span class="label-text">名称</span>
                </label>
                <input type="text" id="datasource-name" class="input input-bordered" placeholder="如：我的理杏仁" required>
            </div>
            
            <div class="form-control mb-3">
                <label class="label">
                    <span class="label-text">数据源类型</span>
                </label>
                <select id="datasource-type" class="select select-bordered" required onchange="SettingsManager.renderConfigFields()">
                    <option value="" disabled selected>请选择类型</option>
                </select>
            </div>
            
            <!-- 动态配置字段 -->
            <div id="datasource-config-fields"></div>
            
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('datasource-modal').close()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>关闭</button>
    </form>
</dialog>

<!-- 删除确认模态框 -->
<dialog id="delete-confirm-modal" class="modal">
    <div class="modal-box bg-base-300/90 backdrop-blur-md">
        <h3 class="font-bold text-lg mb-4 text-error">确认删除</h3>
        <p class="py-4" id="delete-confirm-message">确定要删除这个数据源吗？</p>
        <div class="modal-action">
            <button type="button" class="btn" onclick="document.getElementById('delete-confirm-modal').close()">取消</button>
            <button type="button" class="btn btn-error" id="delete-confirm-btn">删除</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>关闭</button>
    </form>
</dialog>
