<!-- 设置 Tab 内容 -->
<div id="settings-tab" class="tab-content hidden">
    <div class="grid grid-cols-1 gap-6">
        
        <!-- 数据源管理 -->
        <div class="card neon-border">
            <div class="card-body">
                <h2 class="card-title text-lg mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
                    </svg>
                    数据源管理
                </h2>
                
                <!-- 数据源列表 -->
                <div class="overflow-x-auto">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="datasource-list">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-4">
                    <button class="btn btn-primary btn-sm" onclick="SettingsManager.showAddModal()">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        添加数据源
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 缓存设置 -->
        <div class="card neon-border">
            <div class="card-body">
                <h2 class="card-title text-lg mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    缓存设置
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 缓存失效时间 -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">缓存失效时间（天）</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="number" id="cache-expire-days" class="input input-bordered w-24" min="1" max="365" value="7">
                            <button class="btn btn-outline btn-sm" onclick="SettingsManager.saveExpireDays()">保存</button>
                        </div>
                    </div>
                    
                    <!-- 缓存状态 -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">缓存状态</span>
                        </label>
                        <div class="flex items-center gap-2">
                            <span id="cache-status" class="text-sm text-gray-400">加载中...</span>
                            <button class="btn btn-accent btn-sm" onclick="SettingsManager.refreshCache()">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                                手动刷新
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

<!-- 添加/编辑数据源模态框 -->
<dialog id="datasource-modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4" id="datasource-modal-title">添加数据源</h3>
        <form id="datasource-form" onsubmit="SettingsManager.handleSubmit(event)">
            <input type="hidden" id="datasource-id">
            
            <div class="form-control mb-3">
                <label class="label">
                    <span class="label-text">名称</span>
                </label>
                <input type="text" id="datasource-name" class="input input-bordered" placeholder="如：我的理杏仁" required>
            </div>
            
            <div class="form-control mb-3">
                <label class="label">
                    <span class="label-text">数据源类型</span>
                </label>
                <select id="datasource-type" class="select select-bordered" required onchange="SettingsManager.renderConfigFields()">
                    <option value="" disabled selected>请选择类型</option>
                </select>
            </div>
            
            <!-- 动态配置字段 -->
            <div id="datasource-config-fields"></div>
            
            <div class="modal-action">
                <button type="button" class="btn" onclick="document.getElementById('datasource-modal').close()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>关闭</button>
    </form>
</dialog>
