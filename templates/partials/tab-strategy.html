<div id="strategy-tab" class="tab-content hidden">
    <div class="card bg-base-300/50 backdrop-blur-sm shadow-xl">
        <div class="card-body">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="card-title gradient-text mb-1">策略中心</h2>
                    <p class="text-sm text-slate-300">左侧管理组合策略，右侧查看可复用的单一策略库。</p>
                </div>
                <button type="button" id="strategy-new-btn" class="btn btn-sm btn-primary">新建组合策略</button>
            </div>

            <div class="strategy-tab-layout">
                <div class="card neon-border">
                    <div class="card-body p-4">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div>
                                <h3 class="font-bold">组合策略</h3>
                                <p class="text-xs text-slate-300 mt-1">你保存的完整策略方案，可继续编辑、分析和删除。</p>
                            </div>
                            <span id="strategy-list-summary" class="text-xs text-slate-300">0 条</span>
                        </div>
                        <div id="strategy-list" class="grid grid-cols-1 gap-3">
                            <div class="text-sm text-slate-300">加载中...</div>
                        </div>
                    </div>
                </div>

                <div class="card neon-border">
                    <div class="card-body p-4">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div>
                                <h3 class="font-bold">单一策略库</h3>
                                <p class="text-xs text-slate-300 mt-1">系统内置的策略模块，可在组合策略详情页中按需加入。</p>
                            </div>
                            <span id="single-strategy-summary" class="text-xs text-slate-300">0 个</span>
                        </div>
                        <div id="single-strategy-list" class="grid grid-cols-1 gap-3">
                            <div class="text-sm text-slate-300">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
