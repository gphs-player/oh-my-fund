<div id="calculator-annualized-content" class="subtab-content" data-subtab-content-group="calculator" style="display: block;">
    <h3 class="text-xl font-bold text-white mb-4">年化收益率计算器</h3>

    <div class="flex flex-wrap gap-6 mb-4">
        <label class="label cursor-pointer justify-start gap-3 rounded-xl border border-cyan-400/20 bg-white/5 px-4 py-3">
            <input type="radio" name="annualized-method" class="radio radio-info radio-sm" checked onchange="switchSubtab('annualized-method', 'method1-content')">
            <span class="label-text text-white">方式一：持有周期 + 总收益率</span>
        </label>
        <label class="label cursor-pointer justify-start gap-3 rounded-xl border border-violet-400/20 bg-white/5 px-4 py-3">
            <input type="radio" name="annualized-method" class="radio radio-secondary radio-sm" onchange="switchSubtab('annualized-method', 'method2-content')">
            <span class="label-text text-white">方式二：期初期末净值</span>
        </label>
    </div>

    <div id="method1-content" class="subtab-content" data-subtab-content-group="annualized-method" style="display: block;">
        <form onsubmit="AnnualizedCalculator.calculateMethod1(event)" class="space-y-4">
            <div class="form-control">
                <label class="label"><span class="label-text">持有周期（年）</span></label>
                <input type="number" id="years1" class="input input-bordered" min="0.01" step="0.01" required>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">总收益率（%）</span></label>
                <input type="number" id="total-return1" class="input input-bordered" step="0.01" required>
            </div>

            <button type="submit" class="btn btn-sm text-white w-1/6 border-none" style="background: linear-gradient(135deg, #818cf8, #6366f1);">计算</button>

            <div id="result1" class="alert alert-success hidden mt-4">
                <div class="text-white">
                    <span class="font-bold">年化收益率：</span>
                    <span id="result1-value" class="text-2xl font-bold text-slate-200"></span>
                </div>
            </div>
        </form>
    </div>

    <div id="method2-content" class="subtab-content hidden" data-subtab-content-group="annualized-method">
        <form onsubmit="AnnualizedCalculator.calculateMethod2(event)" class="space-y-4">
            <div class="form-control">
                <label class="label"><span class="label-text">期初净值</span></label>
                <input type="number" id="initial-nav" class="input input-bordered" step="0.0001" min="0" required>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">持有周期（年）</span></label>
                <input type="number" id="years2" class="input input-bordered" min="0.01" step="0.01" required>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">期末净值</span></label>
                <input type="number" id="final-nav" class="input input-bordered" step="0.0001" min="0" required>
            </div>

            <button type="submit" class="btn btn-sm text-white w-1/6 border-none" style="background: linear-gradient(135deg, #818cf8, #6366f1);">计算</button>

            <div id="result2" class="alert alert-success hidden mt-4">
                <div class="text-white">
                    <div><span class="font-bold">总收益率：</span><span id="result2-total" class="text-slate-200"></span></div>
                    <div><span class="font-bold">年化收益率：</span><span id="result2-annual" class="text-2xl font-bold text-slate-200"></span></div>
                </div>
            </div>
        </form>
    </div>
</div>
