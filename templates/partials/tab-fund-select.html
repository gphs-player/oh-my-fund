<div id="fund-select-tab" class="tab-content hidden">
    <div class="card bg-base-300/50 backdrop-blur-sm shadow-xl">
        <div class="card-body">
            <h2 class="card-title gradient-text">多维选基</h2>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-0">
                <div class="form-control mb-0">
                    <label class="label"><span class="label-text">按编码或名称搜索</span></label>
                    <div class="relative">
                        <input type="text" id="fund-search-keyword" class="input input-bordered w-full pr-10 h-9 min-h-9" placeholder="输入基金代码或基金名称">
                        <button
                            type="button"
                            id="fund-search-clear"
                            class="absolute right-2 inset-y-0 my-auto hidden btn btn-ghost btn-xs btn-no-hover-lift h-6 min-h-0"
                            onclick="FundSelector.clearKeyword()"
                            title="清空搜索">
                            ✕
                        </button>
                    </div>
                </div>
                <div class="form-control mb-0">
                    <label class="label"><span class="label-text">基金类型</span></label>
                    <select id="fund-search-type" class="select select-bordered h-9 min-h-9">
                        <option value="">全部类型</option>
                    </select>
                </div>
            </div>

            <div id="fund-select-loading" class="hidden mt-6">
                <div class="alert" style="background: rgba(34, 211, 238, 0.12); border: 1px solid rgba(34, 211, 238, 0.35);">
                    <span>正在加载基金列表...</span>
                </div>
            </div>

            <div id="fund-select-empty" class="hidden mt-6">
                <div class="card neon-border">
                    <div class="card-body min-h-0 text-center py-10">
                        <h3 id="fund-empty-title" class="text-xl font-bold mb-2">暂无基金数据</h3>
                        <p id="fund-empty-desc" class="text-slate-300">请先在设置页激活可用的数据源，并刷新基金缓存。</p>
                    </div>
                </div>
            </div>

            <div id="fund-select-table-wrapper" class="hidden mt-6">
                <div class="overflow-x-auto">
                    <table class="table table-zebra w-full fund-select-table">
                        <thead>
                            <tr>
                                <th style="width: 90px;">序号</th>
                                <th style="width: 160px;">基金代码</th>
                                <th>基金名称</th>
                                <th style="width: 180px;">基金类型</th>
                                <th style="width: 180px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fund-select-table-body">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>

                <div id="fund-select-pagination" class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 mt-4">
                    <div class="flex flex-wrap items-center gap-3">
                        <div id="fund-select-summary" class="text-sm text-slate-300">
                            暂未加载基金数据
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-300">每页</span>
                            <select id="fund-page-size" class="select select-bordered select-sm w-24">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="30">30</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                            <span class="text-sm text-slate-300">条</span>
                        </div>
                    </div>
                    <div id="fund-select-pagination-buttons" class="flex flex-wrap items-center justify-end gap-2">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<dialog id="fund-detail-modal" class="modal">
    <div class="modal-box bg-base-300/90 backdrop-blur-md max-w-5xl">
        <div class="flex items-start justify-between gap-4 mb-4">
            <div>
                <h3 class="font-bold text-xl" id="fund-detail-title">基金详情</h3>
            </div>
            <button type="button" class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('fund-detail-modal').close()">✕</button>
        </div>

        <div id="fund-detail-loading" class="hidden">
            <div class="flex items-center justify-center py-16">
                <span class="loading loading-spinner loading-lg text-cyan-300"></span>
            </div>
        </div>

        <div id="fund-detail-error" class="hidden">
            <div class="alert alert-error">
                <span id="fund-detail-error-text">加载失败</span>
            </div>
        </div>

        <div id="fund-detail-content" class="hidden">
            <div class="overflow-x-auto">
                <table class="table table-zebra w-full">
                    <tbody id="fund-detail-table-body">
                        <!-- 动态填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>关闭</button>
    </form>
</dialog>
