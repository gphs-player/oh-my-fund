<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个亿小目标</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed" style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}');">

    <!-- 毛玻璃容器 -->
    <div class="min-h-screen backdrop-blur-md bg-black/30">
        <div class="container mx-auto px-4 pt-8 pb-6" style="max-width: 80%;">

            <!-- 顶部导航栏：左侧Logo+标题，右侧Tab -->
            <div class="flex justify-between items-center mb-10">
                <!-- 左侧：Logo + 标题 -->
                <div class="flex items-center gap-3">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="w-10 h-10">
                    <h1 class="text-3xl font-bold shimmer-text">一个亿小目标</h1>
                </div>

                <!-- 右侧：Tab导航 -->
                <div role="tablist" class="tabs tabs-bordered bg-transparent">
                    <a role="tab" class="tab tab-active" data-tab="investment">我的持仓</a>
                    <a role="tab" class="tab" data-tab="fund-select">基金市场</a>
                    <a role="tab" class="tab" data-tab="strategy">策略</a>
                    <a role="tab" class="tab" data-tab="calculator">计算器</a>
                    <a role="tab" class="tab" data-tab="settings">设置</a>
                </div>
            </div>

            <!-- Tab内容 -->
            {% include 'partials/tab-investment.html' %}
            {% include 'partials/tab-fund-select.html' %}
            {% include 'partials/tab-strategy.html' %}
            {% include 'partials/tab-calculator.html' %}
            {% include 'partials/tab-settings.html' %}
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/investment.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fund-select.js') }}"></script>
    <script src="{{ url_for('static', filename='js/strategy.js') }}"></script>
    <script src="{{ url_for('static', filename='js/annualized.js') }}"></script>
    <script src="{{ url_for('static', filename='js/compound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
    <script>
        function switchMainTab(tabName) {
            const targetTabButton = document.querySelector(`[data-tab="${tabName}"]`);
            const targetTab = document.getElementById(`${tabName}-tab`);
            if (!targetTabButton || !targetTab) return;

            document.querySelectorAll('[data-tab]').forEach(t => t.classList.remove('tab-active'));
            document.querySelectorAll('.tab-content').forEach(c => {
                c.classList.add('hidden');
                c.style.display = 'none';
            });

            targetTabButton.classList.add('tab-active');
            targetTab.classList.remove('hidden');
            targetTab.style.display = 'block';
        }

        window.switchMainTab = switchMainTab;

        // Tab切换逻辑 - 只选择有data-tab属性的主Tab
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', function() {
                switchMainTab(this.dataset.tab);
                if (this.dataset.tab === 'strategy') {
                    history.replaceState(null, '', '#strategy');
                } else if (window.location.hash === '#strategy') {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
            });
        });

        if (window.location.hash === '#strategy') {
            switchMainTab('strategy');
        }

        function switchSubtab(groupName, targetId) {
            const targetContent = document.getElementById(targetId);
            if (!targetContent) return;

            document.querySelectorAll(`[data-subtab-group="${groupName}"]`).forEach(tab => {
                tab.classList.toggle('tab-active', tab.dataset.subtabTarget === targetId);
            });

            document.querySelectorAll(`[data-subtab-content-group="${groupName}"]`).forEach(content => {
                const isTarget = content.id === targetId;
                content.classList.toggle('hidden', !isTarget);
                content.style.display = isTarget ? 'block' : 'none';
            });
        }

        window.switchSubtab = switchSubtab;

        document.querySelectorAll('[data-subtab-group]').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.stopPropagation();
                switchSubtab(this.dataset.subtabGroup, this.dataset.subtabTarget);
            });
        });
    </script>
</body>
</html>
